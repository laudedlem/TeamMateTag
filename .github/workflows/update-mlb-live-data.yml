name: Update MLB Live Data

on:
  workflow_dispatch:
    inputs:
      season:
        description: MLB season year
        required: false
        type: string
      season_to_date:
        description: Backfill from March 1 through today
        required: false
        default: false
        type: boolean
  schedule:
    # Late enough to catch most completed West Coast games, cheap enough to rerun.
    - cron: "20 10 * * *"

jobs:
  update-mlb-live-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "psycopg[binary]" requests python-dotenv

      - name: Update current MLB appearances
        shell: bash
        run: |
          args=()
          if [[ -n "${{ inputs.season }}" ]]; then
            args+=(--season "${{ inputs.season }}")
          fi
          if [[ "${{ inputs.season_to_date }}" == "true" ]]; then
            args+=(--season-to-date)
          fi
          python scripts/update_mlb_live_data.py "${args[@]}"
