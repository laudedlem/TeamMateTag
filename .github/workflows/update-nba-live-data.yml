name: Update NBA Live Data

on:
  workflow_dispatch:
    inputs:
      season:
        description: NBA season start year, for example 2026 for 2026-27
        required: false
        type: string
      season_to_date:
        description: Backfill from October 1 through today
        required: false
        default: false
        type: boolean
  schedule:
    # Runs after overnight West Coast games are final; offseason runs no-op.
    - cron: "55 10 * * *"

jobs:
  update-nba-live-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "psycopg[binary]" requests python-dotenv

      - name: Update current NBA appearances
        shell: bash
        run: |
          args=()
          if [[ -n "${{ inputs.season }}" ]]; then
            args+=(--season "${{ inputs.season }}")
          fi
          if [[ "${{ inputs.season_to_date }}" == "true" ]]; then
            args+=(--season-to-date)
          fi
          python scripts/update_nba_live_data.py "${args[@]}"
