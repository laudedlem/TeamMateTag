<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset Password | TeamMateTag</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body class="dark">
  <header>
    <div class="title">
      <div class="brand-row">
        <h1>TeamMateTag</h1>
        <span class="app-version" title="Current version">0.1.39</span>
      </div>
      <span class="subtitle">Reset password</span>
    </div>
  </header>

  <section class="screen">
    <div class="start-card legal-page">
      <a class="back-link" href="/">&#8592; Back to home</a>
      <div class="legal-card">
        <h2>Reset Password</h2>
        <p class="muted">
          Choose a new password for your TeamMateTag account.
        </p>
        <form id="reset-password-form" class="auth-card" autocomplete="off">
          <div class="auth-grid">
            <input id="new-password" type="password" maxlength="120" placeholder="New password" />
            <input id="confirm-password" type="password" maxlength="120" placeholder="Confirm new password" />
          </div>
          <div class="auth-actions">
            <button id="reset-password-btn" class="primary" type="submit">Save New Password</button>
          </div>
        </form>
        <p id="reset-password-status" class="muted small"></p>
        <p class="muted small">
          If the reset link has expired, head back to the home page and request a fresh one, or contact
          <a class="footer-link" href="mailto:{{ support_email }}">{{ support_email }}</a>.
        </p>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseUrl = {{ supabase_url|tojson }};
    const supabaseAnonKey = {{ supabase_anon_key|tojson }};
    const form = document.getElementById('reset-password-form');
    const newPassword = document.getElementById('new-password');
    const confirmPassword = document.getElementById('confirm-password');
    const statusEl = document.getElementById('reset-password-status');
    const button = document.getElementById('reset-password-btn');

    let supabaseClient = null;

    function setStatus(message) {
      statusEl.textContent = message;
    }

    async function init() {
      if (!supabaseUrl || !supabaseAnonKey || !window.supabase) {
        form.hidden = true;
        setStatus('Password reset is not available right now. Please try again later.');
        return;
      }
      supabaseClient = window.supabase.createClient(supabaseUrl, supabaseAnonKey, {
        auth: {
          autoRefreshToken: false,
          persistSession: false,
          detectSessionInUrl: true,
        },
      });
      const { data, error } = await supabaseClient.auth.getSession();
      if (error || !data.session) {
        form.hidden = true;
        setStatus('This reset link is no longer active. Request a new password reset from the home page.');
        return;
      }
      setStatus('Ready. Enter your new password below.');
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const password = newPassword.value;
      const confirm = confirmPassword.value;
      if (password.length < 6) {
        setStatus('Password must be at least 6 characters.');
        return;
      }
      if (password !== confirm) {
        setStatus('Passwords do not match.');
        return;
      }
      button.disabled = true;
      setStatus('Saving new password...');
      const { error } = await supabaseClient.auth.updateUser({ password });
      button.disabled = false;
      if (error) {
        setStatus(error.message || 'Could not update password.');
        return;
      }
      await supabaseClient.auth.signOut();
      newPassword.value = '';
      confirmPassword.value = '';
      setStatus('Password updated. You can head back home and log in with the new password.');
    });

    init();
  </script>
</body>
</html>
